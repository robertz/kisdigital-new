<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Pixel Canvas</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A live, shared pixel canvas — place a pixel and watch everyone else's show up in real time.">
	<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="pc-app">
	<header class="pc-topbar">
		<span class="pc-title">Pixel Canvas</span>
		<span class="pc-status" id="status">connecting&hellip;</span>
		<span class="pc-count" id="viewerHint"></span>
	</header>

	<div class="pc-board-wrap">
		<canvas id="board" class="pc-board"></canvas>
	</div>

	<div class="pc-palette" id="palette"></div>

	<p class="pc-note">Shared with everyone looking at this page right now — no account needed. One pixel every few seconds. Cleared on the next deploy.</p>
</div>

<script src="./js/app.js"></script>
</body>
</html>
