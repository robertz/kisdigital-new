<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Chat</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A small, shared chat room across a few channels — no account needed.">
	<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="ch-app">

	<div class="ch-name-gate" id="nameGate">
		<div class="ch-name-card">
			<p class="ch-name-title">Pick a display name</p>
			<input type="text" id="nameInput" class="ch-name-input" maxlength="24" placeholder="e.g. Rob" autocomplete="off">
			<button type="button" id="nameSubmit" class="ch-name-submit">Join chat</button>
			<p class="ch-name-hint">No account, no password — this is just a label on your messages. Cleared on the next deploy.</p>
		</div>
	</div>

	<aside class="ch-sidebar">
		<div class="ch-sidebar-header">
			<span class="ch-title">Chat</span>
			<span class="ch-status" id="status">connecting&hellip;</span>
		</div>
		<nav class="ch-channels" id="channelList"></nav>
		<div class="ch-me">
			<span class="ch-me-label">You:</span>
			<span class="ch-me-name" id="meName"></span>
			<button type="button" class="ch-me-change" id="changeName">change</button>
		</div>
	</aside>

	<main class="ch-main">
		<header class="ch-main-header">
			<span class="ch-channel-title" id="channelTitle">#general</span>
			<span class="ch-roster" id="roster"></span>
		</header>
		<div class="ch-messages" id="messages"></div>
		<form class="ch-composer" id="composer">
			<input type="text" id="composerInput" class="ch-composer-input" maxlength="500" placeholder="Message #general" autocomplete="off">
			<button type="submit" class="ch-composer-send">Send</button>
		</form>
	</main>

</div>

<script src="./js/app.js"></script>
</body>
</html>
