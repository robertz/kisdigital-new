# WARNING on secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY
# are deliberately NOT declared below. GitHub-triggered deploys (deploy_on_push)
# re-sync the live spec from this file on every push — a SECRET key declared
# here with a placeholder value gets individually re-encrypted as that literal
# placeholder each time, which then shadows the real value if one was also set
# as an app-level (not service-level) env var in the dashboard. That's exactly
# what happened once already: the dashboard-set real R2 credentials were
# silently overridden back to "EDIT_IN_UI" by the next `git push`. Set those
# three at the APP level (Settings > App-Level Environment Variables, not the
# service's own env vars) in the DO dashboard instead — app-level env vars are
# inherited by every service and aren't touched by this file's service.envs
# list. Everything else here is safe to keep declaring, including the
# ${amos.*} database bindings, since App Platform populates those itself.
name: kisdigital
region: nyc

domains:
  - domain: kisdigital.com
    type: PRIMARY
  - domain: www.kisdigital.com
    type: ALIAS

databases:
  # References the existing "amos" managed MySQL cluster (already running
  # pulsely's database on this account) rather than provisioning a new one —
  # cluster_name matching a cluster you already own makes App Platform bind
  # to it instead of creating one. db_name/db_user must already exist on
  # that cluster (both do: the "chron" database and "rob" user). Once bound,
  # ${amos.HOSTNAME}/PORT/DATABASE/USERNAME/PASSWORD below are populated by
  # App Platform itself at deploy time — nothing here or in any env file
  # ever holds the actual password.
  - name: amos
    cluster_name: amos
    db_name: chron
    db_user: rob
    engine: MYSQL
    production: true

services:
  - name: kisdigital
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      repo: robertz/kisdigital-new
      branch: main
      deploy_on_push: true
    http_port: 3005
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    # /health (app.bxs) touches no datasource and renders no view — a MySQL
    # blip shouldn't fail the whole service's health check when the process
    # itself is fine. Module install now happens at image build time (see
    # Dockerfile), not container start, so cold boot is fast and doesn't
    # depend on ForgeBox being reachable — initial_delay_seconds is generous
    # anyway since it's cheap insurance against a slow platform-side cold
    # start.
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
      success_threshold: 1
    envs:
      - key: ENV
        value: production
      - key: PORT
        value: "3005"
      - key: APPNAME
        value: KISDigital
      - key: SITEURL
        value: https://kisdigital.com
      - key: CHRON_DB_HOST
        value: ${amos.HOSTNAME}
      - key: CHRON_DB_PORT
        value: ${amos.PORT}
      - key: CHRON_DB_NAME
        value: ${amos.DATABASE}
      - key: CHRON_DB_USER
        value: ${amos.USERNAME}
      - key: CHRON_DB_PASSWORD
        value: ${amos.PASSWORD}
        type: SECRET
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY are set at the
      # APP level in the dashboard, not here — see the file-header comment.
      - key: R2_BUCKET
        value: kisdigital
      - key: R2_PUBLIC_BASE_URL
        value: https://static.kisdigital.com
      - key: R2_UPLOAD_PREFIX
        value: posts
