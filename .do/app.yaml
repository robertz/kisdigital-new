# This file is a record of the app's spec, not what deploys it. A push to main
# (deploy_on_push) deploys the new code under the spec App Platform already
# has; it does not apply changes made here. Confirmed 2026-10-24: a push that
# added WEBMENTION_* here deployed without them.
#
# To change the live spec, edit it in the dashboard or apply it with doctl,
# and mirror the change here. Don't apply this file as-is: the live spec also
# holds secrets that aren't declared here (the R2 credentials, Google OAuth
# and GoatCounter keys), and applying this file would delete them. Start from
# the live spec instead, which returns secrets encrypted so they survive being
# sent back:
#
#   doctl apps spec get <app-id> > spec.yaml
#   (edit spec.yaml)
#   doctl apps update <app-id> --spec spec.yaml
#
# Keep secrets out of this file. A SECRET declared here with a placeholder
# value, once applied, replaces the real value with the placeholder; that has
# happened once already, setting the R2 credentials to "EDIT_IN_UI". The
# ${amos.*} database bindings are safe to declare, since App Platform fills
# those in itself.
name: kisdigital
region: nyc

domains:
  - domain: kisdigital.com
    type: PRIMARY
  - domain: www.kisdigital.com
    type: ALIAS

databases:
  # References the existing "amos" managed MySQL cluster (already running
  # pulsely's database on this account) rather than provisioning a new one —
  # cluster_name matching a cluster you already own makes App Platform bind
  # to it instead of creating one. db_name/db_user must already exist on
  # that cluster (both do: the "chron" database and "rob" user). Once bound,
  # ${amos.HOSTNAME}/PORT/DATABASE/USERNAME/PASSWORD below are populated by
  # App Platform itself at deploy time — nothing here or in any env file
  # ever holds the actual password.
  - name: amos
    cluster_name: amos
    db_name: chron
    db_user: rob
    engine: MYSQL
    production: true

services:
  - name: kisdigital
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      repo: robertz/kisdigital-new
      branch: main
      deploy_on_push: true
    http_port: 3005
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    # /health (app.bxs) touches no datasource and renders no view — a MySQL
    # blip shouldn't fail the whole service's health check when the process
    # itself is fine. Module install now happens at image build time (see
    # Dockerfile), not container start, so cold boot is fast and doesn't
    # depend on ForgeBox being reachable — initial_delay_seconds is generous
    # anyway since it's cheap insurance against a slow platform-side cold
    # start.
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
      success_threshold: 1
    envs:
      - key: ENV
        value: production
      - key: PORT
        value: "3005"
      - key: APPNAME
        value: KISDigital
      - key: SITEURL
        value: https://kisdigital.com
      - key: CHRON_DB_HOST
        value: ${amos.HOSTNAME}
      - key: CHRON_DB_PORT
        value: ${amos.PORT}
      - key: CHRON_DB_NAME
        value: ${amos.DATABASE}
      - key: CHRON_DB_USER
        value: ${amos.USERNAME}
      - key: CHRON_DB_PASSWORD
        value: ${amos.PASSWORD}
        type: SECRET
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY are set at the
      # APP level in the dashboard, not here — see the file-header comment.
      - key: R2_BUCKET
        value: kisdigital
      - key: R2_PUBLIC_BASE_URL
        value: https://static.kisdigital.com
      - key: R2_UPLOAD_PREFIX
        value: posts
      # ActivityPub (bx-activitypub): federates as @blog@kisdigital.com (the
      # domain comes from SITEURL). Needs db/migrations/0017-0019 applied to
      # production before deploying. ACTIVITYPUB_SINCE is the cutoff: only
      # posts published at or after it federate. See .env.example for all four.
      - key: ACTIVITYPUB_ENABLED
        value: "true"
      - key: ACTIVITYPUB_HANDLE
        value: blog
      - key: ACTIVITYPUB_AUTHOR_ID
        value: cf509c38-63c0-11ef-b36c-9a6c4d3d4dca
      - key: ACTIVITYPUB_SINCE
        value: "2026-09-27T00:00:00Z"
      # Webmention: needs db/migrations/0027 applied to production.
      # WEBMENTION_SEND_SINCE turns on sending for posts published at or after
      # it; empty means receive only. See .env.example.
      - key: WEBMENTION_ENABLED
        value: "true"
      - key: WEBMENTION_SEND_SINCE
        value: "2026-10-24T00:00:00Z"
